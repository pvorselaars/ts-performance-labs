site_name: TS Performance Labs
site_description: "TS performance, basics to mastery"
site_url: https://pvorselaars.github.io/ts-performance-labs/
repo_url: https://github.com/pvorselaars/ts-performance-labs
repo_name: pvorselaars/ts-performance-labs
edit_uri: edit/main/

docs_dir: ..
site_dir: ../../ts-performance-labs-site

theme:
  name: material
  icon:
    logo: material/rocket-launch
  favicon: material/rocket-launch
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.path
    - toc.follow
    - search.suggest
    - content.code.copy

plugins:
  - search

# Mermaid is loaded here (Material would otherwise fetch the same file itself) so mermaid-theme.js can add the
# dark-mode rules Material's own Mermaid theming lacks for xy charts.
extra_css:
  - docs/assets/mermaid-theme.css
extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - docs/assets/mermaid-theme.js

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# This is a code repo, not a docs/ folder: docs_dir is the repo root so every
# README.md, HINTS.md and SOLUTION.md is picked up in place and relative links
# between them keep working unchanged. Everything that isn't reading material
# is excluded below. If you add a new top-level folder that shouldn't be
# published (another source dir, another tool config), add it here too.
# MkDocs excludes a root-level /templates/ folder by default (it's the
# conventional Jinja2 theme-override directory) — un-exclude ours, which is
# just our LAB-LOG.md/POSTMORTEM.md fill-in templates, not a theme override.
exclude_docs: |
  !/templates/
  .git/**
  .github/**
  .claude/**
  .mkdocs/**
  .vs/**
  .idea/**
  .vscode/**
  .venv-docs/**
  .profiles/**
  node_modules/**
  **/node_modules/**
  src/**
  scripts/**
  requirements-docs.txt
  package.json
  package-lock.json
  **/package.json
  tsconfig*.json
  .nvmrc
  *.ts
  **/*.ts
